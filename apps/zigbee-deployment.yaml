apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  replicas: 1
  # PVC jest ReadWriteOnce - RollingUpdate zakleszczyłby się na montowaniu wolumenu
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      priorityClassName: home-important
      initContainers:
      # UWAGA: Zigbee2MQTT dopisuje do configuration.yaml klucz sieci, pan_id
      # i listę sparowanych urządzeń. Nadpisanie tego pliku = utrata sieci Zigbee.
      # ConfigMapa służy WYŁĄCZNIE do zasiania pliku przy pierwszym starcie.
      - name: init-config
        image: busybox:1.38.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -f /app/data/configuration.yaml ]; then
            echo "configuration.yaml już istnieje - nie ruszam (zawiera klucz sieci i sparowane urządzenia)"
          else
            echo "pierwszy start - kopiuję configuration.yaml z ConfigMapy"
            cp /tmp/config/configuration.yaml /app/data/configuration.yaml
          fi
        volumeMounts:
        - name: config-template
          mountPath: /tmp/config
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      containers:
      - name: zigbee2mqtt
        image: koenkk/zigbee2mqtt:2.13.0
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "Europe/Warsaw"
        securityContext:
          privileged: true
        ports:
        - containerPort: 8080
          name: http
        # Frontend odpowiada dopiero po nawiązaniu połączenia z koordynatorem
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - mountPath: /app/data
          name: data
        - mountPath: /dev/ttyUSB0
          name: zigbee-adapter
      volumes:
      - name: config-template
        configMap:
          name: zigbee2mqtt-config
      - name: data
        persistentVolumeClaim:
          claimName: zigbee2mqtt-pvc
      - name: zigbee-adapter
        hostPath:
          path: /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_8c676bf57af3ef11b2cdba1b6d9880ab-if00-port0
          type: File
