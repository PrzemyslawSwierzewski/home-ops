apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      # Krok inicjalizacyjny: kopiuje konfigurację tak, aby Zigbee2MQTT mógł w niej pisać
      initContainers:
      - name: init-config
        image: busybox:latest
        command: ['sh', '-c', 'cp /tmp/config/configuration.yaml /app/data/configuration.yaml']
        volumeMounts:
        - name: config-template
          mountPath: /tmp/config
        - name: data
          mountPath: /app/data
      containers:
      - name: zigbee2mqtt
        image: koenkk/zigbee2mqtt:latest
        env:
        - name: TZ
          value: "Europe/Warsaw"
        securityContext:
          privileged: true
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - mountPath: /app/data
          name: data
        - mountPath: /dev/ttyUSB0
          name: zigbee-adapter
      volumes:
      - name: config-template
        configMap:
          name: zigbee2mqtt-config
      - name: data
        persistentVolumeClaim:
          claimName: zigbee2mqtt-pvc
      - name: zigbee-adapter
        hostPath:
          path: /dev/ttyUSB0
          type: CharDevice
