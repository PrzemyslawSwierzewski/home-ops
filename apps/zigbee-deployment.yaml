apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      priorityClassName: home-important
      initContainers:
      - name: init-config
        image: busybox:1.38.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -f /app/data/configuration.yaml ]; then
            echo "configuration.yaml już istnieje - nie ruszam"
          else
            echo "pierwszy start - kopiuję configuration.yaml z ConfigMapy"
            cp /tmp/config/configuration.yaml /app/data/configuration.yaml
          fi
        volumeMounts:
        - name: config-template
          mountPath: /tmp/config
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      containers:
      - name: zigbee2mqtt
        image: koenkk/zigbee2mqtt:2.13.0
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "Europe/Warsaw"
        securityContext:
          privileged: true
          runAsUser: 0
        ports:
        - containerPort: 8080
          name: http
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - mountPath: /app/data
          name: data
        - mountPath: /dev
          name: dev-host
      volumes:
      - name: config-template
        configMap:
          name: zigbee2mqtt-config
      - name: data
        persistentVolumeClaim:
          claimName: zigbee2mqtt-pvc
      - name: dev-host
        hostPath:
          path: /dev
          type: Directory