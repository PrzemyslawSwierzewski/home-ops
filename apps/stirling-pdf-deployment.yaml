apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  labels:
    app: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          # Oficjalny, ultra-lekki obraz
          image: frooodle/s-pdf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOCKER_ENABLE_SECURITY
              value: "false"
            - name: SYSTEM_DEFAULT_LOCALE
              value: "pl_PL"
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi