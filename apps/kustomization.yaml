apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Komponenty Fluxa (domyślne)
  - flux-system/gotk-components.yaml
  - flux-system/gotk-sync.yaml

  # Priority Classes - dla zarządzania zasobami na single-node klastrze
  - priority-classes.yaml

  # Home assistant
  - namespace.yaml
  - home_Assistant-PVC.yaml
  - mosquitto-PVC.yaml
  - zigbee-PVC.yaml
  - zigbee-configmap.yaml
  - home_Assistant-deployment.yaml
  - mosquitto-deployment.yaml
  - zigbee-deployment.yaml
  - home_Assistant-service.yaml
  - mosquitto-service.yaml
  - zigbee-service.yaml
  - home_Assistant-ingress.yaml
  - zigbee-ingress.yaml

  # Tailscale
  - tailscale-namespace.yaml
  - tailscale-operator.yaml

  # Pihole
  - pihole-namespace.yaml
  - pihole-service.yaml
  - pihole-deployment.yaml
  - pihole-ingress.yaml
  - pihole-PVC.yaml

  # Homepage - ConfigMap generowana z configMapGenerator
  - homepage-namespace.yaml
  - homepage-deployment.yaml
  - homepage-service.yaml
  - homepage-ingress.yaml
  # USUŃ: homepage-configmap.yaml - zastąpiona przez configMapGenerator

  # Stirling PDF
  - stirling-pdf-namespace.yaml
  - stirling-pdf-deployment.yaml
  - stirling-pdf-service.yaml
  - stirling-pdf-ingress.yaml

  # Backup na Azure (włączyć później)
# - backup-namespace.yaml
# - backup-serviceaccount.yaml
# - backup-cronjob.yaml
# - backup-secret.yaml

# vaultwarden:
  - vaultwarden-namespace.yaml
  - vaultwarden-PVC.yaml
  - vaultwarden-deployment.yaml
  - vaultwarden-service.yaml
  - vaultwarden-ingress.yaml

configMapGenerator:
  - name: homepage-config
    namespace: homepage
    files:
      - config/settings.yaml
      - config/services.yaml
      - config/bookmarks.yaml
      - config/widgets.yaml
      - config/custom.css
    behavior: create