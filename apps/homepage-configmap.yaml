apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  custom.css: |
    /* Pogrubienie wszystkich tekstów */
    * {
      font-weight: 700 !important;
    }

    /* Kafelki głównych usług i szukajki (białe z czarną ramką) */
    .service-card, .widget-card, #search {
      background-color: rgba(255, 255, 255, 0.95) !important;
      color: #000000 !important;
      border: 2px solid #000000 !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* 🌸 DUŻA CZARNA RAMKA TYLKO DOOkoła CAŁEJ GRUPY QUICK LINKS 🌸 */
    .bookmark-container, .bookmark-group {
      background-color: rgba(255, 255, 255, 0.95) !important;
      border: 2px solid #000000 !important;
      border-radius: 12px !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* ❌ USUNIĘCIE OBRĘCZY / RAMKI Z POJEDYNCZYCH LINKÓW (GitHub, YouTube, Google) ❌ */
    .bookmark {
      border: none !important;
      background-color: transparent !important;
      box-shadow: none !important;
    }

    /* Czarny kolor tekstów i ikon w zakładkach */
    .bookmark-container *, .bookmark-group * {
      color: #000000 !important;
    }

    /* 📊 WIDGET STATYSTYK 📊 */
    .widget-container {
      background-color: #ffffff !important;
      border: 2px solid #000000 !important;
      border-radius: 12px !important;
      padding: 6px 14px !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* Czarny kolor tekstu i ikonek w statystykach */
    .widget-container, 
    .information-widget-resource,
    .information-widget-resource * {
      color: #000000 !important;
    }

    .information-widget-resource svg {
      color: #000000 !important;
      stroke: #000000 !important;
      fill: none !important;
    }

    /* Paski zużycia zasobów */
    .resource-usage {
      background-color: #e5e7eb !important;
    }
    .resource-usage > div {
      background-color: #000000 !important;
    }

    /* Nagłówki sekcji */
    .group-title, h2, h3 {
      color: #000000 !important;
      text-shadow: 0px 0px 8px rgba(255, 255, 255, 0.9);
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid #000000;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
    }

  settings.yaml: |
    title: Hello Kitty Dashboard 🎀
    background: https://i.pinimg.com/1200x/e8/15/2a/e8152a5d0516df591415ee0eba5d29d8.jpg
    theme: light
    color: slate
    showStats: true

  services.yaml: |
    - Home Automation:
        - Home Assistant:
            icon: home-assistant.svg
            href: https://homeassistant.tail318b16.ts.net
            description: Zarządzanie domem i automatyzacja
            ping: https://homeassistant.tail318b16.ts.net
        - Zigbee2MQTT:
            icon: zigbee2mqtt.svg
            href: https://home-automation-zigbee2mqtt-ingress-ingress.tail318b16.ts.net
            description: Mostek urządzeń Zigbee
            ping: https://home-automation-zigbee2mqtt-ingress-ingress.tail318b16.ts.net

    - Network & Infrastructure:
        - Pi-hole:
            icon: pi-hole.svg
            href: https://pihole.tail318b16.ts.net/admin/
            description: Blokowanie reklam i serwer DNS
            ping: https://pihole.tail318b16.ts.net/admin/

    - Tools & Utilities:
        - Stirling-PDF:
            icon: stirling-pdf.svg
            href: https://stirling-pdf-stirling-pdf-ingress-ingress.tail318b16.ts.net
            description: Narzędzie do edycji i konwersji PDF
            ping: https://stirling-pdf-stirling-pdf-ingress-ingress.tail318b16.ts.net

  bookmarks.yaml: |
    - Quick Links:
        - GitHub:
            - title: GitHub Repos
              abbr: GH
              href: https://github.com/PrzemyslawSwierzewski/home-ops/tree/main
              icon: github.svg
        - YouTube:
            - title: YouTube
              abbr: YT
              href: https://www.youtube.com/
              icon: youtube.svg
        - Google:
            - title: Wyszukiwarka Google
              abbr: GG
              href: https://www.google.com/
              icon: google.svg
        - FitGirl:
            - title: FitGirl Repacks
              abbr: FG
              href: https://fitgirl-repacks.site/
              icon: utorrent.svg
        - Linkedin:
            - title: LinkedIn
              abbr: LI
              href: https://www.linkedin.com/
              icon: linkedin.svg
        - EXT torrents:
            - title: EXT torrents
              abbr: EXT
              href: https://ext-torrents.org/
              icon: utorrent.svg
        - 💸 Tracking spłat długów Dorotki 👩🏻‍💻 - Arkusze Google:
            - title: Tracking spłat długów Dorotki 👩🏻‍💻
              abbr: DOROTKA
              href: https://docs.google.com/spreadsheets/d/1-UX2R16oNa9jFLVFenW6rgmbNmSpNkTXg4c8X4k03H8/edit?gid=0#gid=0
              icon: google-sheets.svg
        - youtube music:
            - title: YouTube Music
              abbr: YTM
              href: https://music.youtube.com/
              icon: youtube-music.svg
        - gmail:
            - title: Gmail
              abbr: GM
              href: https://mail.google.com/mail/u/0/#inbox
              icon: gmail.svg

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: google
        target: _blank