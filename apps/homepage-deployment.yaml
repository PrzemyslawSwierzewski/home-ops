apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
      # Przy każdej zmianie ConfigMapy ta adnotacja zmienia się
      # (dzięki configMapGenerator). Flux wyzwala rollout poda → kopią się nowe pliki.
      annotations:
        checksum/config: "unset-by-kustomize"
    spec:
      initContainers:
        - name: copy-configs
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'cp /config-source/* /app/config/ || true']
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: config-writable
              mountPath: /app/config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config-writable
              mountPath: /app/config
      volumes:
        - name: config-source
          configMap:
            name: homepage-config
        - name: config-writable
          emptyDir: {}
