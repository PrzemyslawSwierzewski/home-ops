apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      # Kontener inicjalizacyjny kopiuje pliki z ConfigMapy do zapisywalnego wolumenu emptyDir
      initContainers:
        - name: copy-configs
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'cp /config-source/* /app/config/ || true']
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: config-writable
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config-writable
              mountPath: /app/config
      volumes:
        - name: config-source
          configMap:
            name: homepage-config
        - name: config-writable
          emptyDir: {}