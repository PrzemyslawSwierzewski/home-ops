# UWAGA: Ten plik jest TEMPLATE!
#
# Aby skonfigurować OAuth dla Tailscale operatora:
#
# 1. Przejdź do https://login.tailscale.com/admin/settings/keys
#
# 2. Wygeneruj OAuth client (OAuth 2.0 Client):
#    - Reuse existing key jest OK dla homelabu
#
# 3. Pobierz Client ID i Client Secret
#
# 4. Utwórz secret:
#    cat > tailscale-secret.yaml << 'EOF'
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: tailscale-auth
#      namespace: tailscale
#    type: Opaque
#    stringData:
#      oauth_client_id: "YOUR-CLIENT-ID"
#      oauth_client_secret: "YOUR-CLIENT-SECRET"
#    EOF
#
# 5. Zaszyfruj SOPS:
#    sops -e tailscale-secret.yaml > tailscale-secret-enc.yaml
#    mv tailscale-secret-enc.yaml tailscale-secret.yaml
#
# 6. Dodaj do resources w kustomization.yaml
#
# 7. Flux aplikuje - Tailscale operator dostaje credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: tailscale
type: Opaque
stringData:
  oauth_client_id: "YOUR_OAUTH_CLIENT_ID_HERE"
  oauth_client_secret: "YOUR_OAUTH_CLIENT_SECRET_HERE"
