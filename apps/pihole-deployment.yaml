apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      # DNS dla całej sieci domowej - musi przetrwać presję pamięciową na node
      priorityClassName: home-critical
      containers:
      - name: pihole
        image: pihole/pihole:2026.07.2
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "Europe/Warsaw"
        - name: FTLCONF_LOCAL_IPV4
          value: "0.0.0.0"
        - name: DNSMASQ_LISTENING
          value: "all"
        - name: FTLCONF_webserver_api_password
          valueFrom:
            secretKeyRef:
              name: pihole-secret
              key: FTLCONF_webserver_api_password
        ports:
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 80
          name: http
          protocol: TCP
        # Odwzorowanie oficjalnego HEALTHCHECK z obrazu - sprawdza realne
        # rozwiązywanie nazw, a nie tylko czy proces żyje.
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - dig -p $(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - dig -p $(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - dig -p $(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: pihole-data
          mountPath: /etc/pihole
          subPath: etc-pihole
        - name: pihole-data
          mountPath: /etc/dnsmasq.d
          subPath: etc-dnsmasq
      volumes:
      - name: pihole-data
        persistentVolumeClaim:
          claimName: pihole-pvc
