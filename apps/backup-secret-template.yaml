# UWAGA: TEMPLATE! Szyfruj tym SOPS przed committem do repo.
#
# Aby utworzyć Secret dla Azure Blob Storage:
#
# 1. Pobierz dane z Azure CLI:
#    az storage account show-connection-string \
#      --resource-group home-ops-rg \
#      --name homeopsbackup... \
#      --query connectionString -o tsv
#
# 2. Connection string ma format:
#    DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...
#
# 3. Wyodrębnij:
#    - AccountName
#    - AccountKey
#
# 4. Utwórz secret:
#    cat > apps/backup-secret.yaml << 'EOF'
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: azure-backup
#      namespace: backup
#    type: Opaque
#    stringData:
#      AZURE_ACCOUNT_NAME: "homeopsbackup..."
#      AZURE_ACCOUNT_KEY: "..."
#      RESTIC_REPOSITORY: "azure:pvc-backups:/"
#      RESTIC_PASSWORD: "$(openssl rand -base64 32)"
#    EOF
#
# 5. Zaszyfruj SOPS:
#    sops -e apps/backup-secret.yaml > apps/backup-secret-enc.yaml
#    rm apps/backup-secret.yaml
#    mv apps/backup-secret-enc.yaml apps/backup-secret.yaml
#
# 6. Dodaj do kustomization.yaml resources
#
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-backup
  namespace: backup
type: Opaque
stringData:
  # Azure Storage Account Name
  AZURE_ACCOUNT_NAME: "homeopsbackup..."
  # Azure Storage Account Key
  AZURE_ACCOUNT_KEY: "..."
  # Restic repository - Azure Blob Storage
  RESTIC_REPOSITORY: "azure:pvc-backups:/"
  # Losowe hasło do Restic repo (dla szyfrownia)
  RESTIC_PASSWORD: "change-me-to-random-32-chars"
