# UWAGA: Ten plik jest TEMPLATE! Nie aplikuj go bezpośrednio.
#
# Aby skonfigurować deszyfrowanie SOPS dla Fluxa:
#
# 1. Wygeneruj klucz age (jeśli go jeszcze nie masz):
#    age-keygen -o ~/.age/keys.txt
#
# 2. Wyświetl public key:
#    cat ~/.age/keys.txt | grep "public key"
#
# 3. Zaktualizuj .sops.yaml - zmień public key
#
# 4. Na Raspberry Pi, zainstaluj age w systemie (ubuntu/debian):
#    sudo apt install age
#
# 5. Skopiuj klucz private do flux-system namespace:
#    kubectl create secret generic sops-age \
#      --from-file=age.agekey=~/.age/keys.txt \
#      -n flux-system
#
# 6. Dodaj zmienną do Flux:
#    kubectl set env deployment/source-controller \
#      AGE_KEY=$(cat ~/.age/keys.txt | grep -oP 'AGE-SECRET-KEY-.*') \
#      -n flux-system
#
# 7. Teraz możesz szyfrować sekrety:
#    sops -e apps/pihole-secret.yaml > apps/pihole-secret.enc.yaml
#
# Flux będzie automatycznie deszyfrować sekrety przy aplikowaniu manifeztów.
---
apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
type: Opaque
data:
  # Base64-encoded AGE-SECRET-KEY-...
  # Ustaw to na rzeczywistym kluczu
  age.agekey: QUdFLVNFQ1JFVC1LRVktWW91ci1BZ2UtS2V5LUhlcmUtUkVQTEFDRS1NRQ==
