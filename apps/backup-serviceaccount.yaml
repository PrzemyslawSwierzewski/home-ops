apiVersion: v1
kind: ServiceAccount
metadata:
  name: restic-backup
  namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: restic-backup
rules:
  # Potrzeba dostępu do PVC do backupowania
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "get"]
  # Potrzeba podać pod do namespaces dla snapshots
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["create", "delete", "get", "list", "patch"]
  # Tworzenie snapshots volumów (dla LVM/LKE)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: restic-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: restic-backup
subjects:
  - kind: ServiceAccount
    name: restic-backup
    namespace: backup
